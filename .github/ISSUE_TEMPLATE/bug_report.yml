name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The exact command or code, and a few lines of the input file if possible.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or error message
      render: text
  - type: input
    id: version
    attributes:
      label: labcurve version
      description: Output of `labcurve --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
      placeholder: Python 3.13 on Windows 11
