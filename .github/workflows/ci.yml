# Continuous integration: every push to main and every pull request must pass
# formatting, linting, type-checking, the test suite and a package build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on the same branch or pull request supersedes a running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package with development tools
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check --diff .

      - name: Lint
        run: ruff check --output-format=github .

      - name: Type-check
        run: mypy

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package with development tools
        run: python -m pip install -e ".[dev]"

      - name: Run the tests with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Add the coverage table to the run summary
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          {
            echo "### Test coverage"
            echo
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  oldest-dependencies:
    name: Test (oldest supported dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # "lowest-direct" installs the lower bounds declared in pyproject.toml,
      # which proves that the stated minimum versions really work.
      - name: Install the lowest declared versions
        run: |
          python -m pip install uv
          uv pip install --system --resolution lowest-direct -e ".[dev]"

      - name: Run the tests
        run: python -m pytest

  build:
    name: Build and smoke-test the package
    needs: [lint, test, oldest-dependencies]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build the source distribution and the wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install the wheel into a clean environment and run it
        run: |
          python -m venv smoke
          smoke/bin/python -m pip install dist/*.whl
          smoke/bin/labcurve --version
          smoke/bin/labcurve analyze examples/cooling.csv \
            -x time_s -y temp_c --yerr temp_err_c \
            --model exponential --reject-outliers --out-dir smoke-results
          test -s smoke-results/fit.png
          test -s smoke-results/report.json

      - name: Upload the built package
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Upload the example analysis
        uses: actions/upload-artifact@v7
        with:
          name: example-analysis
          path: smoke-results/
          if-no-files-found: error
