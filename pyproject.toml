[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "labcurve"
dynamic = ["version"]
description = "Clean, summarise, fit and plot experimental measurements stored in CSV files."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kuanshpek Zhansaya" }]
keywords = ["curve fitting", "data processing", "research software", "reproducibility", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff~=0.16.0",
    "mypy~=2.4.0",
    "pandas-stubs>=2.2",
    "build>=1.2",
    "twine>=6.1",
]

[project.scripts]
labcurve = "labcurve.cli:main"

[project.urls]
Homepage = "https://github.com/KuanshpekZ/labcurve"
Issues = "https://github.com/KuanshpekZ/labcurve/issues"
Changelog = "https://github.com/KuanshpekZ/labcurve/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/labcurve/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/tools", "/examples", "/docs", "/CHANGELOG.md", "/CITATION.cff"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.coverage.run]
source = ["labcurve"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # modern syntax
    "D",   # docstrings
    "N",   # naming
    "SIM", # simplifications
    "PTH", # pathlib instead of os.path
    "RUF", # ruff-specific checks
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/labcurve"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
